name: architecture-decision-records
services:
  architecture:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./architecture:/app/architecture:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"