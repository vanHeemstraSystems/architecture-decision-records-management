<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kami Architecture Explorer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <div class="view-menu" aria-label="Architecture view selector">
      <a class="menu-button menu-link" href="http://localhost:9090" target="_blank" rel="noreferrer">2D</a>
      <button class="menu-button is-active" type="button" data-view="3d">3D</button>
      <button class="menu-button" type="button" data-view="overview">Overview</button>
    </div>

    <div class="panel">
      <h1>Kami Explorer</h1>
      <p>
        A warm, context-preserving spatial projection of the architecture model.
        Structurizr remains the authoritative model; this is the spatial view.
      </p>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
